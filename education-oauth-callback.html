<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正在完成家长身份绑定</title><style>body{margin:0;background:#f5f6f7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.card{width:min(420px,calc(100vw - 36px));margin:18vh auto;padding:32px 24px;border:1px solid #e1e4e6;border-radius:18px;background:#fff;text-align:center}.card b{display:block;font-size:23px}.card p{color:#7b8389;line-height:1.7}.dot{width:52px;height:52px;margin:0 auto 18px;border:5px solid #ffe0c6;border-top-color:#ff7200;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main class="card"><div class="dot"></div><b>正在绑定家长身份</b><p id="status">请稍候，不要关闭页面。</p></main><script>const API='https://sxf-basketball-d9gp6yt0rd1f7be4d.service.tcloudbase.com/api/education-public',q=new URLSearchParams(location.search);fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'oauthCallback',code:q.get('code'),state:q.get('state')})}).then(r=>r.json()).then(data=>{if(!data.ok)throw new Error(data.message||'绑定失败');location.replace(data.redirectUrl)}).catch(error=>{document.querySelector('.dot').style.display='none';document.querySelector('#status').textContent=error.message||'绑定失败，请重新扫码'})</script></body></html>
