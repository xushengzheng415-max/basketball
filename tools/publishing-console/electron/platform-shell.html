<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>平台登录</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 72px; overflow: hidden; }
    body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 22px;
      color: #172019;
      background: #f4f1e9;
      border-bottom: 1px solid #d9d8cf;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .identity { display: flex; align-items: center; gap: 12px; }
    .mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 11px;
      color: white;
      background: #1f6b4f;
      font-weight: 800;
    }
    strong, span { display: block; }
    strong { margin-bottom: 4px; font-size: 15px; }
    span { color: #687169; font-size: 11px; }
    .safety {
      padding: 8px 12px;
      border: 1px solid #abc5b3;
      border-radius: 999px;
      color: #1f6b4f;
      background: #edf6ef;
      font-size: 11px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="identity">
    <div class="mark" id="mark">账</div>
    <div>
      <strong id="name">平台登录</strong>
      <span>登录完成后，回到主控制台填写并确认账号名称</span>
    </div>
  </div>
  <div class="safety">独立登录记忆 · 不读取密码与Cookie</div>
  <script>
    const name = new URLSearchParams(location.search).get('name') || '平台登录';
    document.querySelector('#name').textContent = name;
    document.querySelector('#mark').textContent = name.slice(0, 1);
    document.title = `${name} · 多平台发文控制台`;
  </script>
</body>
</html>
