server {
    listen 80;
    listen [::]:80;
    server_name api.saixiaofeng.com;

    access_log /var/log/nginx/api.saixiaofeng.com.access.log;
    error_log /var/log/nginx/api.saixiaofeng.com.error.log;

    location = /health {
        proxy_pass http://127.0.0.1:3100/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /wecom/customer {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:3100/wecom/customer$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 1m;
    }

    location ^~ /wecom/identity {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 32k;
    }

    location / {
        return 404;
    }
}
