<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>添加赛小蜂赛事顾问</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1f2329;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.page{min-height:100vh;padding:32px 20px}.card{max-width:460px;margin:0 auto;background:#fff;border-radius:20px;padding:28px 22px;box-shadow:0 12px 36px rgba(31,35,41,.08);text-align:center}.brand{color:#f56600;font-weight:800;letter-spacing:.08em}.title{font-size:25px;margin:14px 0 10px}.lead{margin:0;color:#646a73;line-height:1.7}.qr{display:block;width:min(100%,360px);margin:22px auto 12px;border-radius:16px}.hint{margin:0;color:#f56600;font-weight:700}.note{margin:18px 0 0;color:#8f959e;font-size:14px;line-height:1.6}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">赛小蜂篮球</div>
      <h1 class="title">添加赛事顾问</h1>
      <p class="lead">尚未添加赛事顾问，请长按下方二维码识别添加。添加成功后发送“赛事需求已提交 + 机构或主办方名称”。</p>
      <img class="qr" src="/assets/wecom/event-form-contact.png" alt="赛小蜂赛事顾问企业微信二维码">
      <p class="hint">长按二维码识别添加</p>
      <p class="note">已经添加过赛事顾问？再次扫码不会重复发送欢迎语，请直接回到原聊天窗口，发送“赛事需求已提交 + 机构或主办方名称”。</p>
      <p class="note">本入口仅用于赛事需求对接，不会将您标记为公众号渠道客户。</p>
    </section>
  </main>
</body>
</html>
