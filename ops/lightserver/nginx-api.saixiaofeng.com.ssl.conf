server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name api.saixiaofeng.com;

    ssl_certificate /etc/letsencrypt/live/api.saixiaofeng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.saixiaofeng.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/api.saixiaofeng.com.access.log;
    error_log /var/log/nginx/api.saixiaofeng.com.error.log;

    location = /health {
        proxy_pass http://127.0.0.1:3100/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /wecom/customer {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:3100/wecom/customer$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 1m;
    }

    location ^~ /wecom/identity {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 32k;
    }

    location = /wecom/doc-assistant {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:3200/wecom/doc-assistant$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 1m;
    }

    location = /wecom/event-consultant {
        alias /var/www/api.saixiaofeng.com/event-consultant.html;
        default_type text/html;
    }

    location = /assets/wecom/event-form-contact.png {
        alias /var/www/api.saixiaofeng.com/event-form-contact.png;
        default_type image/png;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.saixiaofeng.com;
    return 301 https://$host$request_uri;
}
